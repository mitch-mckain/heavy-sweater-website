<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HS Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f8f6;
      --fg: #1a1917;
      --muted: #888;
      --border: #e0e0e0;
      --card-bg: #faf9f7;
      --red: #e02020;
      --green: #1a7a3c;
    }

    body {
      font-family: 'Fira Code', monospace;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 48px 20px 64px;
    }

    /* ── LOGIN ── */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      min-height: 60vh;
      width: 100%;
      max-width: 360px;
    }

    .login-title {
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    #key-input {
      width: 100%;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      padding: 12px 16px;
      background: none;
      border: 1px solid var(--border);
      color: var(--fg);
      outline: none;
      letter-spacing: 0.04em;
    }
    #key-input:focus { border-color: var(--fg); }

    .login-error {
      font-size: 0.65rem;
      color: var(--red);
      letter-spacing: 0.05em;
      min-height: 1em;
    }

    /* ── SHARED BUTTON ── */
    .btn {
      font-family: 'Fira Code', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      padding: 10px 24px;
      border: 1px solid var(--fg);
      background: none;
      color: var(--fg);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      width: 100%;
    }
    .btn:hover { background: var(--fg); color: var(--bg); }
    .btn.filled { background: var(--fg); color: var(--bg); }
    .btn.filled:hover { opacity: 0.8; }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:hover { background: var(--red); color: #fff; }
    .btn:disabled { opacity: 0.4; pointer-events: none; }

    /* ── ADMIN DASHBOARD ── */
    #dashboard { display: none; flex-direction: column; gap: 40px; width: 100%; max-width: 640px; }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .dash-title {
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .dash-logout {
      font-family: 'Fira Code', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 0;
    }
    .dash-logout:hover { color: var(--fg); }

    /* ── PRODUCT BLOCK ── */
    .product-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-name {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .size-rows { display: flex; flex-direction: column; }

    .size-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      gap: 16px;
    }
    .size-row:first-child { border-top: 1px solid var(--border); }

    .size-label {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      width: 40px;
      flex-shrink: 0;
    }

    .stock-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stock-btn {
      width: 28px;
      height: 28px;
      font-family: 'Fira Code', monospace;
      font-size: 1rem;
      line-height: 1;
      background: none;
      border: 1px solid var(--border);
      color: var(--fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .stock-btn:hover { border-color: var(--fg); }

    .stock-input {
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      width: 52px;
      text-align: center;
      padding: 4px 6px;
      background: none;
      border: 1px solid var(--border);
      color: var(--fg);
      outline: none;
    }
    .stock-input:focus { border-color: var(--fg); }

    .save-row-btn {
      font-family: 'Fira Code', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.06em;
      padding: 5px 12px;
      border: 1px solid var(--border);
      background: none;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .save-row-btn:hover { border-color: var(--fg); color: var(--fg); }
    .save-row-btn.saved { border-color: var(--green); color: var(--green); }
    .save-row-btn.error { border-color: var(--red); color: var(--red); }

    /* ── STATUS BAR ── */
    #status-bar {
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-align: center;
      padding-top: 8px;
    }

    /* Loading skeleton */
    .skeleton {
      height: 44px;
      background: linear-gradient(90deg, var(--border) 25%, #eee 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      margin-bottom: 1px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="login-screen">
    <div class="login-title">heavy sweater / admin</div>
    <input id="key-input" type="password" placeholder="admin key" autocomplete="current-password" />
    <div class="login-error" id="login-error"></div>
    <button class="btn filled" onclick="login()">Enter</button>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <div class="dash-header">
      <div class="dash-title">inventory</div>
      <button class="dash-logout" onclick="logout()">sign out</button>
    </div>
    <div id="inventory-area"></div>
    <div id="status-bar"></div>
  </div>

  <script>
    const PRODUCTS = {
      hoodie:           { name: 'Hoodie',            sizes: ['M', 'L', 'XL', 'XXL'] },
      devil_tshirt:     { name: 'Devil T-Shirt',     sizes: ['S', 'M', 'L'] },
      stretcher_tshirt: { name: 'Stretcher T-Shirt', sizes: ['S', 'M', 'L', 'XL', 'XXL'] },
    };

    let _adminKey = '';

    // ── Login ───────────────────────────────────────────
    document.getElementById('key-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });

    async function login() {
      const key = document.getElementById('key-input').value.trim();
      if (!key) return;
      const errEl = document.getElementById('login-error');
      errEl.textContent = '';

      try {
        const res = await fetch('/api/set-inventory', {
          headers: { 'x-admin-key': key }
        });
        if (res.status === 401) { errEl.textContent = 'incorrect key'; return; }
        if (!res.ok) { errEl.textContent = 'server error — try again'; return; }

        _adminKey = key;
        sessionStorage.setItem('hs_admin_key', key);
        const data = await res.json();
        showDashboard(data);
      } catch (e) {
        errEl.textContent = 'could not reach server';
      }
    }

    function logout() {
      sessionStorage.removeItem('hs_admin_key');
      _adminKey = '';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('key-input').value = '';
    }

    // ── Dashboard ────────────────────────────────────────
    function showDashboard(inventoryData) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      renderInventory(inventoryData);
    }

    function renderInventory(data) {
      const area = document.getElementById('inventory-area');
      area.innerHTML = '';

      for (const [productId, product] of Object.entries(PRODUCTS)) {
        const block = document.createElement('div');
        block.className = 'product-block';

        const nameEl = document.createElement('div');
        nameEl.className = 'product-name';
        nameEl.textContent = product.name;
        block.appendChild(nameEl);

        const rows = document.createElement('div');
        rows.className = 'size-rows';

        product.sizes.forEach(size => {
          const stock = (data[productId] && data[productId][size] != null)
            ? data[productId][size] : 0;

          const row = document.createElement('div');
          row.className = 'size-row';
          row.innerHTML = `
            <span class="size-label">${size}</span>
            <div class="stock-controls">
              <button class="stock-btn" onclick="adjustStock(this, -1)">−</button>
              <input class="stock-input" type="number" min="0" value="${stock}"
                data-product="${productId}" data-size="${size}"
                onchange="markUnsaved(this)" />
              <button class="stock-btn" onclick="adjustStock(this, 1)">+</button>
            </div>
            <button class="save-row-btn" onclick="saveRow(this)">save</button>
          `;
          rows.appendChild(row);
        });

        block.appendChild(rows);
        area.appendChild(block);
      }

      setStatus(`last loaded ${new Date().toLocaleTimeString()}`);
    }

    function adjustStock(btn, delta) {
      const input = btn.closest('.stock-controls').querySelector('.stock-input');
      const newVal = Math.max(0, parseInt(input.value || '0', 10) + delta);
      input.value = newVal;
      markUnsaved(input);
    }

    function markUnsaved(input) {
      const saveBtn = input.closest('.size-row').querySelector('.save-row-btn');
      saveBtn.textContent = 'save';
      saveBtn.className = 'save-row-btn';
    }

    async function saveRow(btn) {
      const row = btn.closest('.size-row');
      const input = row.querySelector('.stock-input');
      const productId = input.dataset.product;
      const size = input.dataset.size;
      const stock = parseInt(input.value || '0', 10);

      btn.textContent = '...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/set-inventory', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': _adminKey,
          },
          body: JSON.stringify({ productId, size, stock }),
        });

        if (res.ok) {
          btn.textContent = 'saved ✓';
          btn.className = 'save-row-btn saved';
          setTimeout(() => {
            btn.textContent = 'save';
            btn.className = 'save-row-btn';
          }, 2000);
        } else {
          btn.textContent = 'error';
          btn.className = 'save-row-btn error';
        }
      } catch (e) {
        btn.textContent = 'error';
        btn.className = 'save-row-btn error';
      } finally {
        btn.disabled = false;
      }
    }

    function setStatus(msg) {
      document.getElementById('status-bar').textContent = msg;
    }

    // ── Auto-login if key stored in session ─────────────
    (async function init() {
      const saved = sessionStorage.getItem('hs_admin_key');
      if (!saved) return;
      try {
        const res = await fetch('/api/set-inventory', {
          headers: { 'x-admin-key': saved }
        });
        if (res.ok) {
          _adminKey = saved;
          const data = await res.json();
          showDashboard(data);
        } else {
          sessionStorage.removeItem('hs_admin_key');
        }
      } catch (e) { /* stay on login */ }
    })();
  </script>

</body>
</html>
