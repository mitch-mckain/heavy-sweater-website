<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HS Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f8f6;
      --fg: #1a1917;
      --muted: #888;
      --border: #e0e0e0;
      --card-bg: #faf9f7;
      --red: #e02020;
      --green: #1a7a3c;
    }

    body {
      font-family: 'Fira Code', monospace;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 48px 20px 64px;
    }

    /* ── LOGIN ── */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      min-height: 60vh;
      width: 100%;
      max-width: 360px;
    }

    .login-title {
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    #key-input {
      width: 100%;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      padding: 12px 16px;
      background: none;
      border: 1px solid var(--border);
      color: var(--fg);
      outline: none;
      letter-spacing: 0.04em;
    }
    #key-input:focus { border-color: var(--fg); }

    .login-error {
      font-size: 0.65rem;
      color: var(--red);
      letter-spacing: 0.05em;
      min-height: 1em;
    }

    /* ── SHARED BUTTON ── */
    .btn {
      font-family: 'Fira Code', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      padding: 10px 24px;
      border: 1px solid var(--fg);
      background: none;
      color: var(--fg);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      width: 100%;
    }
    .btn:hover { background: var(--fg); color: var(--bg); }
    .btn.filled { background: var(--fg); color: var(--bg); }
    .btn.filled:hover { opacity: 0.8; }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:hover { background: var(--red); color: #fff; }
    .btn:disabled { opacity: 0.4; pointer-events: none; }

    /* ── ADMIN DASHBOARD ── */
    #dashboard { display: none; flex-direction: column; gap: 32px; width: 100%; max-width: 640px; }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .dash-title {
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .dash-logout {
      font-family: 'Fira Code', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 0;
    }
    .dash-logout:hover { color: var(--fg); }

    /* ── TABS ── */
    .tab-bar {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      font-family: 'Fira Code', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 10px 20px 10px 0;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn.active { color: var(--fg); border-bottom-color: var(--fg); }
    .tab-btn:hover { color: var(--fg); }

    .tab-panel { display: none; flex-direction: column; gap: 32px; }
    .tab-panel.active { display: flex; }

    /* ── PRODUCT BLOCK ── */
    .product-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-name {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .size-rows { display: flex; flex-direction: column; }

    .size-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      gap: 16px;
    }
    .size-row:first-child { border-top: 1px solid var(--border); }

    .size-label {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      width: 40px;
      flex-shrink: 0;
    }

    .stock-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stock-btn {
      width: 28px;
      height: 28px;
      font-family: 'Fira Code', monospace;
      font-size: 1rem;
      line-height: 1;
      background: none;
      border: 1px solid var(--border);
      color: var(--fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .stock-btn:hover { border-color: var(--fg); }

    .stock-input {
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      width: 52px;
      text-align: center;
      padding: 4px 6px;
      background: none;
      border: 1px solid var(--border);
      color: var(--fg);
      outline: none;
    }
    .stock-input:focus { border-color: var(--fg); }

    .save-row-btn {
      font-family: 'Fira Code', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.06em;
      padding: 5px 12px;
      border: 1px solid var(--border);
      background: none;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .save-row-btn:hover { border-color: var(--fg); color: var(--fg); }
    .save-row-btn.saved { border-color: var(--green); color: var(--green); }
    .save-row-btn.error { border-color: var(--red); color: var(--red); }

    /* ── SHOWS ── */
    .shows-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-section-label {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
    }

    .form-label {
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .form-input {
      font-family: 'Fira Code', monospace;
      font-size: 0.78rem;
      padding: 9px 12px;
      background: none;
      border: 1px solid var(--border);
      color: var(--fg);
      outline: none;
      width: 100%;
    }
    .form-input:focus { border-color: var(--fg); }

    .form-checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
    }
    .form-checkbox-row input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--fg);
      cursor: pointer;
      flex-shrink: 0;
    }
    .form-checkbox-row label {
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      color: var(--fg);
      cursor: pointer;
    }

    .add-show-btn {
      font-family: 'Fira Code', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      padding: 11px 24px;
      border: 1px solid var(--fg);
      background: var(--fg);
      color: var(--bg);
      cursor: pointer;
      transition: opacity 0.15s;
      width: 100%;
    }
    .add-show-btn:hover { opacity: 0.8; }
    .add-show-btn:disabled { opacity: 0.4; pointer-events: none; }

    .shows-list {
      display: flex;
      flex-direction: column;
    }

    .show-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
      gap: 16px;
    }
    .show-row:first-child { border-top: 1px solid var(--border); }

    .show-row-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }

    .show-row-venue {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .show-row-meta {
      font-size: 0.6rem;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .delete-show-btn {
      font-family: 'Fira Code', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.06em;
      padding: 5px 12px;
      border: 1px solid var(--border);
      background: none;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .delete-show-btn:hover { border-color: var(--red); color: var(--red); }

    .shows-empty-msg {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      padding: 16px 0;
      text-align: center;
    }

    .form-status {
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      min-height: 1em;
      text-align: center;
    }
    .form-status.ok { color: var(--green); }
    .form-status.err { color: var(--red); }

    /* ── STATUS BAR ── */
    #status-bar {
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-align: center;
      padding-top: 8px;
    }

    /* Loading skeleton */
    .skeleton {
      height: 44px;
      background: linear-gradient(90deg, var(--border) 25%, #eee 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      margin-bottom: 1px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="login-screen">
    <div class="login-title">heavy sweater / admin</div>
    <input id="key-input" type="password" placeholder="admin key" autocomplete="current-password" />
    <div class="login-error" id="login-error"></div>
    <button class="btn filled" onclick="login()">Enter</button>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <div class="dash-header">
      <div class="dash-title">heavy sweater / admin</div>
      <button class="dash-logout" onclick="logout()">sign out</button>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('inventory')">inventory</button>
      <button class="tab-btn" onclick="switchTab('shows')">shows</button>
    </div>

    <!-- Inventory Tab -->
    <div class="tab-panel active" id="tab-inventory">
      <div id="inventory-area"></div>
    </div>

    <!-- Shows Tab -->
    <div class="tab-panel" id="tab-shows">

      <!-- Add show form -->
      <div class="shows-form">
        <div class="form-section-label">add a show</div>

        <div class="form-row">
          <div class="form-field">
            <div class="form-label">Date *</div>
            <input class="form-input" type="date" id="show-date" />
          </div>
          <div class="form-field">
            <div class="form-label">Doors / Time</div>
            <input class="form-input" type="text" id="show-time" placeholder="e.g. Doors 9 PM" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <div class="form-label">Venue *</div>
            <input class="form-input" type="text" id="show-venue" placeholder="e.g. Monarch Tavern" />
          </div>
          <div class="form-field">
            <div class="form-label">City</div>
            <input class="form-input" type="text" id="show-city" placeholder="e.g. Toronto, ON" />
          </div>
        </div>

        <div class="form-field">
          <div class="form-label">Support Acts</div>
          <input class="form-input" type="text" id="show-support" placeholder="e.g. Airgun / Comfort Object" />
        </div>

        <div class="form-row">
          <div class="form-field">
            <div class="form-label">Price Info</div>
            <input class="form-input" type="text" id="show-price" placeholder="e.g. $15 / PWYC" />
          </div>
          <div class="form-field">
            <div class="form-label">Ticket URL</div>
            <input class="form-input" type="text" id="show-ticket" placeholder="https://..." />
          </div>
        </div>

        <div class="form-field">
          <div class="form-label">Poster Image (URL or img/filename.jpg)</div>
          <input class="form-input" type="text" id="show-poster" placeholder="img/myposter.jpg or https://..." />
        </div>

        <div class="form-checkbox-row">
          <input type="checkbox" id="show-door-only" />
          <label for="show-door-only">Sold at door — show greyed-out button instead of ticket link</label>
        </div>

        <button class="add-show-btn" id="add-show-btn" onclick="addShow()">Add Show</button>
        <div class="form-status" id="show-form-status"></div>
      </div>

      <!-- Current shows list -->
      <div>
        <div class="form-section-label" style="margin-bottom: 0;">upcoming shows</div>
        <div class="shows-list" id="shows-list">
          <div class="shows-empty-msg">loading...</div>
        </div>
      </div>
    </div>

    <div id="status-bar"></div>
  </div>

  <script>
    const ALL_SIZES = ['S', 'M', 'L', 'XL', 'XXL', 'XXXL'];
    const PRODUCTS = {
      hoodie:           { name: 'Hoodie',            sizes: ALL_SIZES },
      devil_tshirt:     { name: 'Devil T-Shirt',     sizes: ALL_SIZES },
      stretcher_tshirt: { name: 'Stretcher T-Shirt', sizes: ALL_SIZES },
    };

    let _adminKey = '';

    // ── Tabs ─────────────────────────────────────────────
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
      document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
      document.getElementById(`tab-${tab}`).classList.add('active');
      if (tab === 'shows') loadShows();
    }

    // ── Login ───────────────────────────────────────────
    document.getElementById('key-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });

    async function login() {
      const key = document.getElementById('key-input').value.trim();
      if (!key) return;
      const errEl = document.getElementById('login-error');
      errEl.textContent = '';

      try {
        const res = await fetch('/api/set-inventory', {
          headers: { 'x-admin-key': key }
        });
        if (res.status === 401) { errEl.textContent = 'incorrect key'; return; }
        if (!res.ok) { errEl.textContent = 'server error — try again'; return; }

        _adminKey = key;
        sessionStorage.setItem('hs_admin_key', key);
        const data = await res.json();
        showDashboard(data);
      } catch (e) {
        errEl.textContent = 'could not reach server';
      }
    }

    function logout() {
      sessionStorage.removeItem('hs_admin_key');
      _adminKey = '';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('key-input').value = '';
    }

    // ── Dashboard ────────────────────────────────────────
    function showDashboard(inventoryData) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      renderInventory(inventoryData);
    }

    function renderInventory(data) {
      const area = document.getElementById('inventory-area');
      area.innerHTML = '';

      for (const [productId, product] of Object.entries(PRODUCTS)) {
        const block = document.createElement('div');
        block.className = 'product-block';

        const nameEl = document.createElement('div');
        nameEl.className = 'product-name';
        nameEl.textContent = product.name;
        block.appendChild(nameEl);

        const rows = document.createElement('div');
        rows.className = 'size-rows';

        product.sizes.forEach(size => {
          const stock = (data[productId] && data[productId][size] != null)
            ? data[productId][size] : 0;

          const row = document.createElement('div');
          row.className = 'size-row';
          row.innerHTML = `
            <span class="size-label">${size}</span>
            <div class="stock-controls">
              <button class="stock-btn" onclick="adjustStock(this, -1)">−</button>
              <input class="stock-input" type="number" min="0" value="${stock}"
                data-product="${productId}" data-size="${size}"
                onchange="markUnsaved(this)" />
              <button class="stock-btn" onclick="adjustStock(this, 1)">+</button>
            </div>
            <button class="save-row-btn" onclick="saveRow(this)">save</button>
          `;
          rows.appendChild(row);
        });

        block.appendChild(rows);
        area.appendChild(block);
      }

      setStatus(`last loaded ${new Date().toLocaleTimeString()}`);
    }

    function adjustStock(btn, delta) {
      const input = btn.closest('.stock-controls').querySelector('.stock-input');
      const newVal = Math.max(0, parseInt(input.value || '0', 10) + delta);
      input.value = newVal;
      markUnsaved(input);
    }

    function markUnsaved(input) {
      const saveBtn = input.closest('.size-row').querySelector('.save-row-btn');
      saveBtn.textContent = 'save';
      saveBtn.className = 'save-row-btn';
    }

    async function saveRow(btn) {
      const row = btn.closest('.size-row');
      const input = row.querySelector('.stock-input');
      const productId = input.dataset.product;
      const size = input.dataset.size;
      const stock = parseInt(input.value || '0', 10);

      btn.textContent = '...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/set-inventory', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': _adminKey,
          },
          body: JSON.stringify({ productId, size, stock }),
        });

        if (res.ok) {
          btn.textContent = 'saved ✓';
          btn.className = 'save-row-btn saved';
          setTimeout(() => {
            btn.textContent = 'save';
            btn.className = 'save-row-btn';
          }, 2000);
        } else {
          btn.textContent = 'error';
          btn.className = 'save-row-btn error';
        }
      } catch (e) {
        btn.textContent = 'error';
        btn.className = 'save-row-btn error';
      } finally {
        btn.disabled = false;
      }
    }

    // ── Shows ────────────────────────────────────────────
    let _shows = [];

    async function loadShows() {
      const list = document.getElementById('shows-list');
      list.innerHTML = '<div class="shows-empty-msg">loading...</div>';
      try {
        const res = await fetch('/api/shows');
        _shows = await res.json();
        renderShowsList();
      } catch (e) {
        list.innerHTML = '<div class="shows-empty-msg" style="color:var(--red)">could not load shows</div>';
      }
    }

    function renderShowsList() {
      const list = document.getElementById('shows-list');
      list.innerHTML = '';

      // Filter to upcoming only
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const upcoming = _shows.filter(s => {
        const [y, m, d] = s.date.split('-').map(Number);
        return new Date(y, m - 1, d) >= today;
      });

      if (upcoming.length === 0) {
        list.innerHTML = '<div class="shows-empty-msg">no upcoming shows — add one above</div>';
        return;
      }

      upcoming.forEach(show => {
        const row = document.createElement('div');
        row.className = 'show-row';

        const info = document.createElement('div');
        info.className = 'show-row-info';

        const venue = document.createElement('div');
        venue.className = 'show-row-venue';
        venue.textContent = show.venue;
        info.appendChild(venue);

        const meta = document.createElement('div');
        meta.className = 'show-row-meta';
        let metaParts = [show.date];
        if (show.city) metaParts.push(show.city);
        if (show.support) metaParts.push('w/ ' + show.support);
        meta.textContent = metaParts.join(' · ');
        info.appendChild(meta);

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-show-btn';
        delBtn.textContent = 'remove';
        delBtn.onclick = () => deleteShow(show.id, delBtn);

        row.appendChild(info);
        row.appendChild(delBtn);
        list.appendChild(row);
      });
    }

    async function addShow() {
      const date     = document.getElementById('show-date').value;
      const timeInfo = document.getElementById('show-time').value.trim();
      const venue    = document.getElementById('show-venue').value.trim();
      const city     = document.getElementById('show-city').value.trim();
      const support  = document.getElementById('show-support').value.trim();
      const price    = document.getElementById('show-price').value.trim();
      const ticketUrl = document.getElementById('show-ticket').value.trim();
      const posterSrc = document.getElementById('show-poster').value.trim();
      const doorOnly  = document.getElementById('show-door-only').checked;

      const status = document.getElementById('show-form-status');

      if (!date || !venue) {
        status.textContent = 'date and venue are required';
        status.className = 'form-status err';
        return;
      }

      const btn = document.getElementById('add-show-btn');
      btn.disabled = true;
      btn.textContent = 'Adding...';
      status.textContent = '';
      status.className = 'form-status';

      try {
        const res = await fetch('/api/shows', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': _adminKey,
          },
          body: JSON.stringify({ date, timeInfo, venue, city, support, price, ticketUrl, posterSrc, doorOnly }),
        });

        if (res.ok) {
          // Clear form
          ['show-date','show-time','show-venue','show-city','show-support','show-price','show-ticket','show-poster'].forEach(id => {
            document.getElementById(id).value = '';
          });
          document.getElementById('show-door-only').checked = false;
          status.textContent = 'show added ✓';
          status.className = 'form-status ok';
          setTimeout(() => { status.textContent = ''; status.className = 'form-status'; }, 3000);
          await loadShows();
        } else {
          const err = await res.json();
          status.textContent = err.error || 'error adding show';
          status.className = 'form-status err';
        }
      } catch (e) {
        status.textContent = 'could not reach server';
        status.className = 'form-status err';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Add Show';
      }
    }

    async function deleteShow(id, btn) {
      if (!confirm('Remove this show?')) return;
      btn.textContent = '...';
      btn.disabled = true;
      try {
        const res = await fetch('/api/shows', {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': _adminKey,
          },
          body: JSON.stringify({ id }),
        });
        if (res.ok) {
          await loadShows();
        } else {
          btn.textContent = 'error';
          btn.disabled = false;
        }
      } catch (e) {
        btn.textContent = 'error';
        btn.disabled = false;
      }
    }

    function setStatus(msg) {
      document.getElementById('status-bar').textContent = msg;
    }

    // ── Auto-login if key stored in session ─────────────
    (async function init() {
      const saved = sessionStorage.getItem('hs_admin_key');
      if (!saved) return;
      try {
        const res = await fetch('/api/set-inventory', {
          headers: { 'x-admin-key': saved }
        });
        if (res.ok) {
          _adminKey = saved;
          const data = await res.json();
          showDashboard(data);
        } else {
          sessionStorage.removeItem('hs_admin_key');
        }
      } catch (e) { /* stay on login */ }
    })();
  </script>

</body>
